name: Fetch business assets

on:
  push:
    branches:
      - content/logos-imagens-participantes
    paths:
      - .github/workflows/fetch-business-assets.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/logos-imagens-participantes

      - name: Download verified assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/negocios

          curl -fL --retry 3 --retry-delay 2             "https://www.onodera.com.br/skin/frontend/yepcomm/v3/images/logo-onodera.webp"             -o public/images/negocios/onodera-logo.webp

          curl -fL --retry 3 --retry-delay 2             "https://www.onodera.com.br/media/responsivebannerslider/resized/642x383/_1751549236.webp"             -o public/images/negocios/onodera-cover.webp

          curl -fL --retry 3 --retry-delay 2             "https://i0.wp.com/curapro.com.br/wp-content/uploads/2026/05/logo-curapro-01.png?ssl=1&w=1199"             -o public/images/negocios/curapro-logo.png

          curl -fL --retry 3 --retry-delay 2             "https://i0.wp.com/curapro.com.br/wp-content/uploads/2025/06/DJI_20250329081153_0035_D-scaled-scaled.webp?ssl=1&w=1199"             -o public/images/negocios/curapro-cover.webp

          curl -fL --retry 3 --retry-delay 2             "https://colegiopaulodetarso.com.br/wp-content/uploads/2026/08/vila-secreta.jpeg"             -o public/images/negocios/vila-secreta-logo.jpg

          curl -fL --retry 3 --retry-delay 2             "https://images.sympla.com.br/694aeb886f626.jpg"             -o public/images/negocios/vila-secreta-cover.jpg

          test -s public/images/negocios/onodera-logo.webp
          test -s public/images/negocios/onodera-cover.webp
          test -s public/images/negocios/curapro-logo.png
          test -s public/images/negocios/curapro-cover.webp
          test -s public/images/negocios/vila-secreta-logo.jpg
          test -s public/images/negocios/vila-secreta-cover.jpg

          file public/images/negocios/*

      - name: Commit local assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fetch-business-assets.yml
          git add public/images/negocios
          git commit -m "assets: store participant images locally"
          git push origin HEAD:content/logos-imagens-participantes
