name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Domain tests
        run: npm run test:events

      - name: Build
        run: npm run build

      - name: Start production portal
        run: |
          npm run start > portal.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Portal is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Portal did not start"
          cat portal.log
          exit 1

      - name: Check public routes
        run: npm run check:portal
